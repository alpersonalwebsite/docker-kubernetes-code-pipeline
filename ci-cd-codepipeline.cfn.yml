---
AWSTemplateFormatVersion: 2010-09-09

Description: EKSWSV1


Parameters:

  EksClusterName:
    Type: String
    Description: The name of the EKS cluster created
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: You must enter the EKS cluster name

  GitSourceRepo:
    Type: String
    Description: GitHub source repository - must contain a Dockerfile and buildspec.yml in the base
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: You must enter a GitHub repository name

  GitBranch:
    Type: String
    Description: GitHub git repository branch - change triggers a new build
    MinLength: 1
    MaxLength: 100
    ConstraintDescription: You must enter a GitHub repository branch name

  GitHubToken:
    Type: String
    NoEcho: true
    Description: GitHub API token - see https://github.com/blog/1509-personal-api-tokens
    MinLength: 3
    MaxLength: 100
    ConstraintDescription: You must enter a GitHub personal access token

  GitHubUser:
    Type: String
    Description: GitHub username or organization
    MinLength: 3
    MaxLength: 100
    ConstraintDescription: You must enter a GitHub username or organization

  CodeBuildDockerImage:
    Type: String
    Default: aws/codebuild/standard:4.0
    Description: AWS CodeBuild Docker optimized image
    MinLength: 3
    MaxLength: 100
    ConstraintDescription: You must enter a CodeBuild Docker image

  KubectlRoleName:
    Type: String
    Default: CBKubectlRole
    Description: IAM role used by kubectl to interact with EKS cluster
    MinLength: 3
    MaxLength: 100
    ConstraintDescription: You must enter a kubectl IAM role


Metadata:
  AWS::CloudFormation::Interface:
    ParameterGroups:
      - Label:
          default: GitHub
        Parameters:
          - GitHubUser
          - GitHubToken
          - GitSourceRepo
          - GitBranch
      - Label:
          default: CodeBuild
        Parameters:
          - CodeBuildDockerImage
      - Label:
          default: IAM
        Parameters:
          - KubectlRoleName
      - Label:
          default: EKS
        Parameters:
          - EksClusterName
    ParameterLabels:
      GitHubUser:
        default: Username
      GitHubToken:
        default: Access token
      GitSourceRepo:
        default: Repository
      GitBranch:
        default: Branch
      CodeBuildDockerImage:
        default: Docker image
      KubectlRoleName:
        default: kubectl IAM role
      EksClusterName:
        default: EKS cluster name


Resources:

  EcrDockerRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    # Both policies, per cfn-lint W3011: DeletionPolicy alone still lets a stack UPDATE
    # that replaces the resource delete the original.
    UpdateReplacePolicy: Retain
    Properties:
      # Scan each pushed image for known CVEs. The pipeline pushes on every commit to
      # master and nothing looked at the result.
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      # Untagged layers accumulate forever otherwise, and ECR storage is billed.
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Expire untagged images after 14 days",
                "selection": {
                  "tagStatus": "untagged",
                  "countType": "sinceImagePushed",
                  "countUnit": "days",
                  "countNumber": 14
                },
                "action": { "type": "expire" }
              }
            ]
          }

  CodePipelineArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      # This bucket holds the source artifact, which is the whole repository, and it had
      # none of the three defaults you would want on a bucket holding source.
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      LifecycleConfiguration:
        Rules:
          # Pipeline artifacts are disposable once the build is done; without this the
          # bucket grows by one copy of the repository per commit, forever.
          - Id: ExpireOldArtifacts
            Status: Enabled
            ExpirationInDays: 30
            NoncurrentVersionExpirationInDays: 7

  CustomResourceLambda:
    Type: AWS::Lambda::Function
    Properties:
      Code:
        ZipFile: |
          # Rewritten for three separate defects, each of which alone stopped this stack.
          #
          # 1. Runtime was python2.7. cfn-lint reports E2533: deprecated 2021-07-15, with
          #    CREATION disabled the same day and updates from 2022-05-30. So the stack
          #    could not be created at all, and this was the first thing to fail.
          #
          # 2. `from botocore.vendored import requests` then `requests.put(...)`. The
          #    import still succeeds on botocore 1.43.70, which is what makes this subtle:
          #    only `exceptions` and `packages` survive there, and put, post and get are
          #    all gone. Verified in a container. So the call that signals CloudFormation
          #    raised AttributeError and the custom resource never responded, leaving the
          #    stack waiting on it. urllib.request is in the standard library and needs no
          #    vendored anything.
          #
          # 3. `response["Reason"] = e` assigned the exception OBJECT, and json.dumps ran
          #    outside the try/except. Verified: TypeError: Object of type Exception is not
          #    JSON serializable. The error path therefore crashed before it could report
          #    the error, so a genuine IAM failure produced a hang rather than a FAILED
          #    status. str(exc) below, and the send is wrapped.
          import json
          import urllib.request

          import boto3


          def send(event, context, status, message):
            body = json.dumps({
              'Status': status,
              'Reason': message + ' See details in CloudWatch Log Stream: ' + context.log_stream_name,
              'PhysicalResourceId': context.log_stream_name,
              'StackId': event['StackId'],
              'RequestId': event['RequestId'],
              'LogicalResourceId': event['LogicalResourceId'],
              'Data': {'Message': message},
            }).encode('utf-8')
            request = urllib.request.Request(
              event['ResponseURL'], data=body, method='PUT',
              headers={'content-type': '', 'content-length': str(len(body))})
            urllib.request.urlopen(request)


          def handler(event, context):
            try:
              # Only Create does work. Update and Delete still have to answer, or the
              # stack hangs on them for an hour and then rolls back.
              if event['RequestType'] == 'Create':
                client = boto3.client('iam')
                kubectl_role_name = event['ResourceProperties']['KubectlRoleName']
                build_role_arn = event['ResourceProperties']['CodeBuildServiceRoleArn']

                assume = client.get_role(RoleName=kubectl_role_name)
                assume_doc = assume['Role']['AssumeRolePolicyDocument']
                roles = [{'Effect': 'Allow',
                          'Principal': {'AWS': build_role_arn},
                          'Action': 'sts:AssumeRole'}]

                for statement in assume_doc['Statement']:
                  principal = statement.get('Principal', {})
                  if isinstance(principal, dict) and 'AWS' in principal:
                    existing = principal['AWS']
                    # Was `statement['Principal']['AWS'].startswith(...)`, which raises
                    # AttributeError when the value is a LIST of ARNs, and IAM returns a
                    # list as soon as a second principal is added.
                    if isinstance(existing, str):
                      existing = [existing]
                    if any(str(a).startswith('arn:aws:iam:') for a in existing):
                      roles.append(statement)

                assume_doc['Statement'] = roles
                client.update_assume_role_policy(
                  RoleName=kubectl_role_name,
                  PolicyDocument=json.dumps(assume_doc))

              send(event, context, 'SUCCESS', 'Resource creation successful!')
            except Exception as exc:  # noqa: BLE001 - must report, never propagate
              print(exc)
              try:
                send(event, context, 'FAILED', str(exc))
              except Exception as send_exc:  # noqa: BLE001
                # Nothing else can be done; the stack will time out on the resource.
                print('failed to signal CloudFormation: %s' % send_exc)

      Handler: index.handler
      Role: !GetAtt CustomResourceLambdaExecutionRole.Arn
      Runtime: python3.12
      Timeout: 300

  CustomResourceLambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      ManagedPolicyArns:
        # AWSLambdaENIManagementAccess was dropped. AWS deprecated it in favour of
        # AWSLambdaVPCAccessExecutionRole, and this function has no VpcConfig at all, so
        # the ENI permissions it granted were never used.
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action: sts:AssumeRole
            Principal:
              Service:
                - lambda.amazonaws.com
      Policies:
        - PolicyName: codepipeline-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${KubectlRoleName}
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:UpdateAssumeRolePolicy

  KubectlAssumeRoleCustomResource:
    Type: Custom::CustomResource
    Properties:
      ServiceToken: !GetAtt CustomResourceLambda.Arn
      KubectlRoleName: !Ref KubectlRoleName
      CodeBuildServiceRoleArn: !GetAtt CodeBuildServiceRole.Arn

  CodePipelineServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codepipeline.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: codepipeline-access
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              # Was a single statement with Resource: "*" covering all of these. Two
              # problems with that: the seven codecommit actions are dead, since the source
              # stage is GitHub, and iam:PassRole on "*" beside codebuild:StartBuild on "*"
              # is a privilege-escalation primitive. It lets this role hand ANY role in the
              # account to a service it can start, which is how a CI role becomes an admin
              # role. Both are now scoped to resources in this stack.
              - Resource: !Sub arn:aws:codebuild:${AWS::Region}:${AWS::AccountId}:project/${AWS::StackName}
                Effect: Allow
                Action:
                  - codebuild:StartBuild
                  - codebuild:BatchGetBuilds
              - Resource:
                  - !GetAtt CodeBuildServiceRole.Arn
                  - !Sub arn:aws:iam::${AWS::AccountId}:role/${KubectlRoleName}
                Effect: Allow
                Action:
                  - iam:PassRole
              - Resource: !Sub arn:aws:s3:::${CodePipelineArtifactBucket}/*
                Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:GetObjectVersion
                  - s3:GetBucketVersioning

  CodeBuildServiceRole:
    Type: AWS::IAM::Role
    Properties:
      Path: /
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: root
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/${KubectlRoleName}
                Effect: Allow
                Action:
                  - sts:AssumeRole
              # eks:Describe* on '*' narrowed to the one action the build makes and the
              # one cluster it targets. Checked against the AWS service authorization data
              # rather than assumed: eks:DescribeCluster accepts a cluster ARN, so this is
              # scopable. `aws eks update-kubeconfig` is the only caller.
              - Resource: !Sub arn:aws:eks:${AWS::Region}:${AWS::AccountId}:cluster/${EksClusterName}
                Effect: Allow
                Action:
                  - eks:DescribeCluster
              # Was Resource: '*', which is read access to EVERY SSM parameter in the
              # account, including other applications' SecureString secrets. Scoped to the
              # two this build actually reads. iam-role-policy.json carried the same
              # wildcard and is fixed the same way.
              - Resource:
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/JWT_SECRET
                  - !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/AUTH_USERS
                Effect: Allow
                Action:
                  - ssm:GetParameters
              # Scoped to this project's own log group. All three accept a log-group ARN.
              # NOT verified against real CodeBuild, which needs an AWS account: if a build
              # fails with an AccessDenied on logs, widening this back to '*' is the fix.
              - Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}:*
                Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
              # Stays on '*', and that is correct rather than lazy: checked against the
              # AWS service authorization data, ecr:GetAuthorizationToken accepts NO
              # resource type at all, so '*' is the only policy that can grant it. Same
              # shape as the ec2 Describe actions removed below.
              - Resource: '*'
                Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
              # The eight ec2 network-interface actions were removed. They are the standard
              # grant for a CodeBuild project attached to a VPC, and this project has no
              # VpcConfig, so nothing ever used them. Scoping was not an option either: the
              # Describe actions accept no resource type, so the choice was '*' or nothing.
              # Same reasoning as dropping AWSLambdaENIManagementAccess above. If a VPC is
              # added to the project later, restore this statement.
              - Resource: !Sub arn:aws:s3:::${CodePipelineArtifactBucket}/*
                Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:GetObjectVersion
              - Resource: !Sub arn:aws:ecr:${AWS::Region}:${AWS::AccountId}:repository/${EcrDockerRepository}
                Effect: Allow
                Action:
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                  - ecr:BatchCheckLayerAvailability
                  - ecr:PutImage
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload

  CodeBuildProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Artifacts:
        Type: CODEPIPELINE
      Source:
        Type: CODEPIPELINE
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Type: LINUX_CONTAINER
        Image: !Ref CodeBuildDockerImage
        EnvironmentVariables:
          - Name: REPOSITORY_URI
            Value: !Sub ${AWS::AccountId}.dkr.ecr.${AWS::Region}.amazonaws.com/${EcrDockerRepository}
          - Name: REPOSITORY_NAME
            Value: !Ref GitSourceRepo
          - Name: REPOSITORY_BRANCH
            Value: !Ref GitBranch
          - Name: EKS_CLUSTER_NAME
            Value: !Ref EksClusterName
          - Name: EKS_KUBECTL_ROLE_ARN
            Value: !Sub arn:aws:iam::${AWS::AccountId}:role/${KubectlRoleName}
        PrivilegedMode: true
      Name: !Ref AWS::StackName
      ServiceRole: !GetAtt CodeBuildServiceRole.Arn
    DependsOn: KubectlAssumeRoleCustomResource

  CodePipelineGitHub:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      RoleArn: !GetAtt CodePipelineServiceRole.Arn
      ArtifactStore:
        Type: S3
        Location: !Ref CodePipelineArtifactBucket
      Stages:
        - Name: Source
          Actions:
            - Name: App
              ActionTypeId:
                Category: Source
                Owner: ThirdParty
                Version: 1
                Provider: GitHub
              Configuration:
                Owner: !Ref GitHubUser
                Repo: !Ref GitSourceRepo
                Branch: !Ref GitBranch
                OAuthToken: !Ref GitHubToken
              OutputArtifacts:
                - Name: App
              RunOrder: 1
        - Name: Build
          Actions:
            - Name: Build
              ActionTypeId:
                Category: Build
                Owner: AWS
                Version: 1
                Provider: CodeBuild
              Configuration:
                ProjectName: !Ref CodeBuildProject
              InputArtifacts:
                - Name: App
              OutputArtifacts:
                - Name: BuildOutput
              RunOrder: 1
